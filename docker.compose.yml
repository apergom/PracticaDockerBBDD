version: "3.9"

services:
  db:
    image: postgres:15
    container_name: electro_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: electro_user
      POSTGRES_PASSWORD: electro_pass
      POSTGRES_DB: electro_db
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  app:
    build: ./app
    container_name: electro_app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: electro_user
      DB_PASSWORD: electro_pass
      DB_NAME: electro_db
      DB_PORT: 5432
      SESSION_SECRET: "super_secret_key"
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: electro_nginx
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app

volumes:
  db_data: